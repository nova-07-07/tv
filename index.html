<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Private TV </title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #090b12;
      --panel: rgba(16, 18, 28, 0.8);
      --panel-strong: rgba(10, 12, 18, 0.92);
      --line: rgba(255,255,255,0.08);
      --text: #eef3ff;
      --muted: #a7b0c7;
      --accent: #5cc8ff;
      --accent-2: #8d7dff;
      --good: #5fe0a6;
      --warn: #ffcd5d;
      --danger: #ff6b6b;
    }

    * { box-sizing:border-box; }
    html,body {
      height:100%;
      margin:0;
      background: var(--bg);
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
    }

    body {
      overflow:hidden;
    }

    #app {
      position:relative;
      height:100vh;
      width:100vw;
      overflow:hidden;
      background:
        radial-gradient(circle at top left, rgba(87,140,255,0.22), transparent 26%),
        linear-gradient(135deg, #02050d 0%, #0a0d14 40%, #090b12 100%);
    }

    video#player {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      background:#000;
      display:block;
      filter: brightness(0.9) saturate(1.05);
    }

    #app.movie-mode {
      background:#000;
      color:#eef3ff;
      font-family:Arial, sans-serif;
    }

    .movie-mode video#player {
      object-fit:contain;
      filter:none;
    }

    .movie-mode .top-bar {
      background:linear-gradient(#000c, transparent);
      backdrop-filter:none;
    }

    .movie-mode .bottom-bar {
      background:linear-gradient(transparent, #000d);
      backdrop-filter:none;
    }

    .movie-mode .nav-btn {
      padding:9px 12px;
      border:1px solid #ffffff30;
      border-radius:8px;
      background:#121827dd;
      color:#eef3ff;
      letter-spacing:0;
    }

    .movie-mode .nav-btn:hover {
      background:rgba(122,198,255,.16);
      transform:none;
    }

    .movie-actions,
    .movie-controls {
      display:none;
      align-items:center;
      gap:8px;
    }

    .movie-mode .movie-actions,
    .movie-mode .movie-controls { display:flex; }

    .movie-mode #prevChannel,
    .movie-mode #nextChannel,
    .movie-mode #channelCounter,
    .movie-mode .audio-controls,
    .movie-mode #endTime,
    .movie-mode #prevBottom,
    .movie-mode #nextBottom,
    .movie-mode .logo,
    .movie-mode .hint { display:none; }

    .movie-control { min-width:44px; }
    .movie-source { display:none; }
    .movie-mode .movie-source { display:block; }
    .movie-mode .top-actions { flex:1; justify-content:flex-end; }
    .movie-mode #qualityButton { min-width:112px; }

    .movie-mode .movie-actions { flex-wrap:wrap; justify-content:flex-end; }

    .movie-mode .show-name.movie-source {
      max-width:min(60vw, 520px);
      overflow:hidden;
      text-overflow:ellipsis;
      color:#a7b0c7;
    }

    .top-bar {
      position:absolute;
      left:0;
      right:0;
      top:0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 18px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.58), rgba(0,0,0,0.06));
      backdrop-filter: blur(10px);
      z-index:3;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .top-actions,
    .audio-controls {
      display:flex;
      align-items:center;
      gap:6px;
    }

    .audio-value {
      min-width:54px;
      color:var(--muted);
      text-align:center;
      font-size:11px;
      font-variant-numeric:tabular-nums;
    }

    .nav-btn {
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(8, 10, 18, 0.5);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor:pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    .nav-btn:hover {
      background: rgba(92,200,255,0.18);
      transform: translateY(-1px);
    }

    .nav-btn.small {
      padding: 8px 12px;
      min-width: 42px;
    }

    .status-pill {
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }

    .hint {
      position:absolute;
      left: 20px;
      top: 20px;
      z-index: 4;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.08);
      padding:7px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      pointer-events:none;
    }

    .bottom-bar {
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:flex;
      gap:14px;
      align-items:center;
      padding:12px 18px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.72));
      backdrop-filter: blur(12px);
      color: var(--text);
      box-sizing:border-box;
      pointer-events:auto;
      z-index:3;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .logo {
      width: 82px;
      height: 52px;
      object-fit:contain;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      padding: 4px;
    }

    .logo.movie-logo { filter:invert(1); }

    .info {
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:0;
    }

    .channel-name {
      font-weight: 800;
      font-size: 22px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .show-name {
      color: var(--muted);
      margin-top:4px;
      font-size: 14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .right {
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      min-width: 120px;
      justify-content:flex-end;
    }

    .end-time {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .quality-picker {
      position:absolute;
      right:18px;
      bottom:88px;
      z-index:11;
      width:min(360px, calc(100vw - 36px));
      max-height:min(60vh, 480px);
      overflow:auto;
      padding:14px;
      border:1px solid rgba(255,255,255,0.16);
      border-radius:10px;
      background:rgba(10,12,18,0.96);
      box-shadow:0 16px 48px rgba(0,0,0,0.45);
    }

    .movie-mode .quality-picker {
      right:16px;
      bottom:110px;
      width:min(420px, calc(100% - 24px));
      max-height:60vh;
      border-color:#2a334a;
      border-radius:12px;
      background:rgba(13,17,23,.96);
      box-shadow:none;
    }

    .quality-picker[hidden] { display:none; }

    .movie-loading {
      position:absolute;
      inset:0;
      z-index:8;
      display:grid;
      place-content:center;
      justify-items:center;
      gap:14px;
      color:#fff;
      background:rgba(0,0,0,0.38);
      font-size:14px;
      font-weight:700;
      letter-spacing:.04em;
      text-shadow:0 1px 8px #000;
      pointer-events:none;
    }

    .movie-choice-overlay {
      position:absolute;
      inset:0;
      z-index:9;
      display:grid;
      place-items:center;
      padding:20px;
      background:rgba(0,0,0,0.56);
      backdrop-filter:blur(5px);
    }

    .movie-choice-overlay[hidden] { display:none; }

    .movie-choice-panel {
      width:min(520px, 100%);
      padding:22px;
      border:1px solid rgba(255,255,255,0.18);
      border-radius:10px;
      background:rgba(10,12,18,0.96);
      box-shadow:0 20px 64px rgba(0,0,0,0.55);
    }

    .movie-choice-heading {
      margin:0 0 14px;
      font-size:18px;
      font-weight:800;
    }

    .movie-choice-list { display:grid; gap:8px; }

    .movie-choice {
      width:100%;
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:12px 14px;
      border:1px solid rgba(255,255,255,0.14);
      border-radius:6px;
      background:rgba(255,255,255,0.05);
      color:var(--text);
      text-align:left;
      cursor:pointer;
    }

    .movie-choice[aria-selected="true"] {
      border-color:var(--accent);
      background:rgba(92,200,255,0.18);
      box-shadow:inset 3px 0 var(--accent);
    }

    .movie-choice-detail { color:var(--muted); font-size:12px; text-align:right; }

    .movie-choice-status {
      min-height:20px;
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
    }

    .movie-choice-actions {
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:14px;
    }

    .movie-loading[hidden],
    .seek-bar[hidden] { display:none; }

    .loading-spinner {
      width:48px;
      height:48px;
      border:4px solid rgba(255,255,255,0.32);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin 800ms linear infinite;
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    .seek-bar {
      position:absolute;
      left:0;
      right:0;
      bottom:75px;
      z-index:10;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:34px;
      padding:0 18px;
      color:#fff;
      background:linear-gradient(180deg, transparent, rgba(0,0,0,.72));
      font-size:11px;
      font-variant-numeric:tabular-nums;
      text-shadow:0 1px 5px #000;
    }

    .seek-time { min-width:38px; }

    .seek-input {
      flex:1;
      min-width:0;
      height:24px;
      margin:0;
      appearance:none;
      background:transparent;
      cursor:pointer;
      touch-action:none;
    }

    .seek-input::-webkit-slider-runnable-track {
      height:4px;
      border-radius:4px;
      background:linear-gradient(to right, #fff var(--seek-progress, 0%), rgba(255,255,255,.42) var(--seek-progress, 0%));
    }

    .seek-input::-moz-range-track {
      height:4px;
      border-radius:4px;
      background:rgba(255,255,255,.42);
    }

    .seek-input::-moz-range-progress { height:4px; border-radius:4px; background:#fff; }

    .seek-input::-webkit-slider-thumb {
      width:12px;
      height:12px;
      margin-top:-4px;
      appearance:none;
      border:0;
      border-radius:50%;
      background:#fff;
    }

    .seek-input::-moz-range-thumb {
      width:12px;
      height:12px;
      border:0;
      border-radius:50%;
      background:#fff;
    }

    .quality-heading {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
      font-size:14px;
      font-weight:800;
    }

    .quality-list { display:grid; gap:6px; }

    .quality-option {
      width:100%;
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:6px;
      background:rgba(255,255,255,0.05);
      color:var(--text);
      text-align:left;
      cursor:pointer;
    }

    .quality-option[aria-selected="true"] {
      border-color:var(--accent);
      background:rgba(92,200,255,0.16);
    }

    .movie-mode .quality-option {
      margin:6px 0;
      padding:9px 12px;
      border-color:#ffffff1a;
      border-radius:8px;
      background:rgba(255,255,255,.02);
      color:#eef3ff;
    }

    .movie-mode .quality-option[aria-selected="true"] {
      border-color:#7ac6ff;
      background:rgba(122,198,255,.12);
    }

    .movie-mode .movie-choice-panel {
      border-color:#2a334a;
      border-radius:12px;
      background:rgba(13,17,23,.96);
      box-shadow:none;
    }

    .movie-mode .movie-choice[aria-selected="true"] {
      border-color:#7ac6ff;
      background:rgba(122,198,255,.12);
      box-shadow:inset 3px 0 #7ac6ff;
    }

    .quality-empty { color:var(--muted); font-size:13px; }

    .poster,
    .title {
      display:none !important;
    }

    .flash {
      position:absolute;
      inset:0;
      pointer-events:none;
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 45px rgba(255,255,255,0.04);
      animation: flash 500ms ease-out;
      z-index:1;
    }

    @keyframes flash {
      from { opacity:1; }
      to { opacity:0; }
    }

    #app.ui-hidden .top-bar,
    #app.ui-hidden .bottom-bar,
    #app.ui-hidden .hint,
    #app.ui-hidden .seek-bar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
    }

    #app.ui-hidden .top-bar {
      transform: translateY(-18px);
    }

    #app.ui-hidden .bottom-bar {
      transform: translateY(18px);
    }

    @media (max-width: 820px) {
      .channel-name {
        font-size: 18px;
      }
      .logo {
        width: 70px;
      }
      .nav-btn {
        padding: 7px 12px;
      }
      .quality-picker {
        right:10px;
        bottom:78px;
      }
      .seek-bar { bottom:78px; padding:0 10px; }
    }

    @media (max-width: 520px) {
      .movie-mode .top-bar { padding:8px; }
      .movie-mode .movie-actions,
      .movie-mode .movie-controls { gap:4px; }
      .movie-mode .nav-btn { padding:7px 8px; font-size:11px; }
      .movie-mode .movie-control { min-width:40px; }
      .movie-mode .bottom-bar { gap:8px; padding:9px; }
      .movie-mode .movie-source { max-width:54vw; }
    }
  </style>
</head>
<body>
  <div id="app">
    
    <div id="topBar" class="top-bar">
      <button id="prevChannel" class="nav-btn" type="button">◀ Prev</button>
      <div id="channelCounter" class="status-pill">1 / 30</div>
      <div class="top-actions">
        <div class="movie-actions">
          <button id="movieRefresh" class="nav-btn" type="button">Get latest movie</button>
          <button id="qualityButton" class="nav-btn" type="button" hidden>Quality</button>
          <button id="movieFullscreen" class="nav-btn" type="button">Fullscreen</button>
        </div>
        <div class="audio-controls" aria-label="Audio controls">
          <button id="delayDown" class="nav-btn small" type="button" title="Reduce audio delay [">[</button>
          <span id="delayValue" class="audio-value">0 ms</span>
          <button id="delayUp" class="nav-btn small" type="button" title="Increase audio delay ]">]</button>
          <button id="volumeDown" class="nav-btn small" type="button" aria-label="Volume down" title="Volume down">↓</button>
          <span id="volumeValue" class="audio-value">100%</span>
          <button id="volumeUp" class="nav-btn small" type="button" aria-label="Volume up" title="Volume up">↑</button>
        </div>
        <button id="nextChannel" class="nav-btn" type="button">Next ▶</button>
      </div>
    </div>

    <video id="player" playsinline></video>

    <div id="movieLoading" class="movie-loading" role="status" aria-live="polite" hidden>
      <span class="loading-spinner" aria-hidden="true"></span>
      <span>Loading movie…</span>
    </div>
    <section id="movieChoiceOverlay" class="movie-choice-overlay" aria-label="Choose a movie" hidden>
      <div class="movie-choice-panel">
        <h2 class="movie-choice-heading">Choose a movie</h2>
        <div id="movieChoiceList" class="movie-choice-list"></div>
        <div id="movieChoiceStatus" class="movie-choice-status" role="status" aria-live="polite">Checking latest links…</div>
        <div class="movie-choice-actions">
          <button id="movieRetryButton" class="nav-btn" type="button" hidden>Try again</button>
          <button id="movieQualityButton" class="nav-btn" type="button" hidden>Quality</button>
        </div>
      </div>
    </section>
    <div id="seekBar" class="seek-bar" hidden>
      <span id="currentTime" class="seek-time">0:00</span>
      <input id="seekInput" class="seek-input" type="range" min="0" max="1000" value="0" aria-label="Seek video" disabled />
      <span id="durationTime" class="seek-time">0:00</span>
    </div>

    <div id="flash" class="flash" style="display:none;"></div>

    <div class="bottom-bar" id="bottomBar">
      <img id="logo" class="logo" src="" alt="logo" />
      <div class="info">
        <div id="channelName" class="channel-name">Loading…</div>
        <div id="showName" class="show-name">Connecting to stream…</div>
        <div id="movieSource" class="show-name movie-source"></div>
      </div>
      <div class="right">
        <div id="endTime" class="end-time">LIVE</div>
        <button id="prevBottom" class="nav-btn small" type="button" aria-label="Previous channel">◀</button>
        <button id="nextBottom" class="nav-btn small" type="button" aria-label="Next channel">▶</button>
        <div class="movie-controls">
          <button id="movieBack10" class="nav-btn movie-control" type="button" aria-label="Back 10 seconds">−10s</button>
          <button id="moviePlayPause" class="nav-btn movie-control" type="button">Play</button>
          <button id="movieForward10" class="nav-btn movie-control" type="button" aria-label="Forward 10 seconds">+10s</button>
        </div>
      </div>
    </div>
    <section id="qualityPicker" class="quality-picker" aria-label="Select video quality" hidden>
      <div class="quality-heading">
        <span>Choose quality</span>
        <button id="qualityClose" class="nav-btn small" type="button" aria-label="Close quality picker">×</button>
      </div>
      <div id="qualityList" class="quality-list"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="getMoviesdavideo.js"></script>
  <script>

      'https://raw.githubusercontent.com/nova-07-07/tv/refs/heads/main/main.m3u8',
    //   'https://iptv-org.github.io/iptv/languages/tam.m3u'
    ];
    const JSONBIN_ID = '6ad60decffd5d1605378934f';

    const MOVIE_LINK_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`;

    const app = document.getElementById('app');

    const prevBottomBtn = document.getElementById('prevBottom');
    const nextBottomBtn = document.getElementById('nextBottom');
    const delayDownBtn = document.getElementById('delayDown');
    const delayUpBtn = document.getElementById('delayUp');
    const delayValue = document.getElementById('delayValue');

    const volumeValue = document.getElementById('volumeValue');
    const qualityButton = document.getElementById('qualityButton');
    const movieRefreshButton = document.getElementById('movieRefresh');
    const movieFullscreenButton = document.getElementById('movieFullscreen');

    const movieForward10Button = document.getElementById('movieForward10');
    const movieSourceElement = document.getElementById('movieSource');
    const qualityPicker = document.getElementById('qualityPicker');

    const movieLoading = document.getElementById('movieLoading');
    const movieChoiceOverlay = document.getElementById('movieChoiceOverlay');
    const movieChoiceList = document.getElementById('movieChoiceList');
    const movieChoiceStatus = document.getElementById('movieChoiceStatus');
    const movieRetryButton = document.getElementById('movieRetryButton');
    const movieQualityButton = document.getElementById('movieQualityButton');
    const seekBar = document.getElementById('seekBar');
    const seekInput = document.getElementById('seekInput');
    const currentTimeLabel = document.getElementById('currentTime');
    const durationTimeLabel = document.getElementById('durationTime');

    function cleanChannelName(name) {
      return String(name || 'Tamil Channel')
        .replace(/\s*\(\d+p\)\s*$/i, '')
        .replace(/\s+\|\s+Tamil.*$/i, '')
        .trim();
    }

    function parseM3uPlaylist(text) {
      const lines = text.split(/\r?\n/);
      const list = [];
      let current = null;

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        if (trimmed.startsWith('#EXTINF')) {
          const attrs = {};
          for (const match of trimmed.matchAll(/([A-Za-z0-9-]+)="([^"]*)"/g)) {
            attrs[match[1].toLowerCase()] = match[2];
          }

          const labelMatch = trimmed.match(/,(.*)$/);
          const rawName = attrs['tvg-name'] || (labelMatch ? labelMatch[1].trim() : 'Tamil Channel');
          current = {
            id: attrs['tvg-id'] || `channel-${list.length + 1}`,
            name: cleanChannelName(rawName),
            logo: attrs['tvg-logo'] || '',
            group: attrs['group-title'] || 'Tamil',
            directMedia: attrs['tvg-direct'] === 'true',
            language: 'Tamil',
            resolution: attrs['tvg-resolution'] || 'Unknown',
            url: ''
          };
        } else if (trimmed && !trimmed.startsWith('#') && current) {
          list.push({ ...current, url: trimmed });
          current = null;
        }
      }

      return list;
    }

    function updateCounter() {
      if (!channels.length) {
        channelCounter.textContent = '0 / 0';
        return;
      }
      channelCounter.textContent = `${idx + 1} / ${channels.length}`;
    }

    function dedupeChannels(list) {
      const seen = new Set();
      const result = [];
      list.forEach((ch) => {
        if (!ch.url || !ch.name) return;
        let pathname;
        try {
          pathname = new URL(ch.url).pathname;
        } catch {
          return;
        }
        const key = ch.url.toLowerCase();
        const isKnownMediaFile = /\.(m3u8?|mpd|mp4|m4v|webm|mov)$/i.test(pathname);
        if (seen.has(key) || (!isKnownMediaFile && ch.id !== MOVIE_CHANNEL_ID)) return;
        seen.add(key);
        result.push(ch);
      });
      return result;
    }

    function serializeM3uPlaylist(list) {
      const entries = list.map((channel) => {
        const attributes = [
          `tvg-id="${String(channel.id || '').replace(/"/g, '')}"`,
          `tvg-name="${String(channel.name || '').replace(/"/g, '')}"`,
          `tvg-logo="${String(channel.logo || '').replace(/"/g, '')}"`,
          `group-title="${String(channel.group || 'Tamil').replace(/"/g, '')}"`,
          `tvg-direct="${channel.directMedia ? 'true' : 'false'}"`
        ].join(' ');
        return `#EXTINF:-1 ${attributes},${channel.name}\n${channel.url}`;
      });
      return `#EXTM3U\n${entries.join('\n')}\n`;
    }

    function storeLocalPlaylist(list) {
      const playlistText = serializeM3uPlaylist(list);
      try {
        localStorage.setItem(LOCAL_PLAYLIST_KEY, playlistText);
      } catch (error) {
        console.warn('Could not store the local playlist', error);
      }
      return playlistText;
    }

    function chooseStartIndex(list) {
      return Math.floor(Math.random() * list.length);
    }

    async function loadPlaylist() {
      let cachedChannels = [];
      try {
        const cachedText = localStorage.getItem(LOCAL_PLAYLIST_KEY);
        if (cachedText) cachedChannels = dedupeChannels(parseM3uPlaylist(cachedText));
      } catch (error) {
        console.warn('Could not read the local playlist cache', error);
      }

      if (cachedChannels.length) {
        channels = cachedChannels;
        updateCounter();
        loadChannel(chooseStartIndex(channels), true);
      }

      try {
        const playlists = await Promise.allSettled(PLAYLIST_URLS.map(async (url) => {
          const response = await fetch(url, { cache: 'no-store', redirect: 'follow' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          if (!text.trimStart().startsWith('#EXTM3U')) {
            throw new Error('Response is not an M3U playlist');
          }
          return parseM3uPlaylist(text);
        }));

        const parsed = playlists.flatMap((result, index) => {
          if (result.status === 'fulfilled') return result.value;
          console.warn(`Playlist unavailable: ${PLAYLIST_URLS[index]}`, result.reason);
          return [];
        });
        const refreshedChannels = dedupeChannels(parsed);
        if (!refreshedChannels.length) throw new Error('No valid channels found in available playlists');

        storeLocalPlaylist(refreshedChannels);
        if (!cachedChannels.length) {
          channels = refreshedChannels;
          updateCounter();
          loadChannel(chooseStartIndex(channels), true);
        } else {
          const currentUrl = channels[idx]?.url;
          channels = refreshedChannels;
          const currentIndex = channels.findIndex((channel) => channel.url === currentUrl);
          if (currentIndex !== -1) idx = currentIndex;
          updateCounter();
        }
      } catch (error) {
        console.error('Error loading playlist:', error);
        if (!cachedChannels.length) {
          channels = [];
          channelName.textContent = 'Playlist unavailable';
          showName.textContent = 'Could not load a valid channel list';
          updateCounter();
        }
      }
    }

    function extractMovieUrl(value) {
      const text = String(value || '');
      if (/error\s*:\s*404/i.test(text)) return '';
      const match = text.match(/https?:\/\/[^\s"'<>]+/i);
      if (!match) return '';

      try {
        return new URL(match[0].replace(/[),.;]+$/, '')).href;
      } catch {
        return '';
      }
    }

    function standardMovieOption(videos) {
      const available = videos.filter((item) => item?.url && !failedMovieUrls.has(item.url));
      const nonPreDvd = available.filter((item) => !item.preDVD);
      const choices = (nonPreDvd.length ? nonPreDvd : available)
        .slice()
        .sort((first, second) => (second.resolution || 0) - (first.resolution || 0));
      return [720, 420, 480]
        .map((resolution) => choices.find((item) => item.resolution === resolution))
        .find(Boolean) || choices.find((item) => item.resolution > 0 && item.resolution <= 720) || choices[0] || null;
    }

    function updateMovieQualityButton() {
      const currentOption = [...qualityOptions, ...movieResolvedOptions, ...movieChoiceItems]
        .find((option) => option?.url === movieVideoUrl);
      const label = movieVideoUrl
        ? `Quality ${currentOption?.resolution ? `${currentOption.resolution}p` : 'Unknown'}`
        : 'Quality';
      qualityButton.textContent = label;
      movieQualityButton.textContent = label;
    }

    function clearMovieChoiceTimer() {
      clearTimeout(movieChoiceTimer);
      movieChoiceTimer = null;
    }

    function closeMovieChooser() {
      movieChoiceOverlay.hidden = true;
      clearMovieChoiceTimer();
      clearTimeout(movieResolveLoaderTimer);
      movieResolveLoaderTimer = null;
    }

    function startMovieChoiceCountdown() {
      clearMovieChoiceTimer();
      movieChoiceDeadline = Date.now() + 5000;
      const updateCountdown = () => {
        if (movieChoiceOverlay.hidden) return;
        const selected = movieChoiceItems[movieChoiceSelection];
        if (!selected?.ready) {
          movieChoiceStatus.textContent = 'Finding a playable video link…';
          return;
        }
        const secondsLeft = Math.max(0, Math.ceil((movieChoiceDeadline - Date.now()) / 1000));
        movieChoiceStatus.textContent = `Auto-playing ${selected.label} in ${secondsLeft}…`;
        if (secondsLeft === 0) {
          void playMovieChoice(movieChoiceSelection);
          return;
        }
        movieChoiceTimer = setTimeout(updateCountdown, 200);
      };
      updateCountdown();
    }

    function selectMovieChoice(index, resetCountdown = true) {
      if (!movieChoiceItems.length) return;
      movieChoiceSelection = (index + movieChoiceItems.length) % movieChoiceItems.length;
      movieChoiceList.querySelectorAll('.movie-choice').forEach((option, optionIndex) => {
        option.setAttribute('aria-selected', String(optionIndex === movieChoiceSelection));
      });
      if (resetCountdown) startMovieChoiceCountdown();
    }

    function renderMovieChoices() {
      if (movieChoiceOverlay.hidden) return;
      const previousId = movieChoiceItems[movieChoiceSelection]?.id;
      movieChoiceItems = [];
      if (movieDirectUrl) {
        const directFailed = failedMovieUrls.has(movieDirectUrl);
        movieChoiceItems.push({
          id: 'direct',
          label: 'Movie 1',
          url: directFailed ? '' : movieDirectUrl,
          ready: !directFailed,
          direct: true,
          detail: directFailed ? 'Failed; skipped' : 'Direct video'
        });
      }
      if (movieSourceUrl) {
        const candidate = standardMovieOption(movieResolvedOptions);
        movieChoiceItems.push({
          id: 'source',
          label: 'Movie 2',
          url: candidate?.url || '',
          sourceUrl: movieSourceUrl,
          ready: Boolean(candidate),
          direct: Boolean(candidate?.direct),
          detail: candidate ? `${candidate.resolution || 'Standard'}${candidate.resolution ? 'p' : ''}` : 'Finding video URL…'
        });
      }

      movieChoiceList.replaceChildren();
      movieRetryButton.hidden = movieChoiceItems.length > 0;
      movieQualityButton.hidden = !movieSourceUrl;
      if (!movieChoiceItems.length) {
        movieChoiceStatus.textContent = movieDataReady || movieLinkFetchFailed
          ? 'No movie links found. Try again.'
          : 'Checking latest links…';
        clearMovieChoiceTimer();
        return;
      }

      movieChoiceItems.forEach((item, optionIndex) => {
        const button = document.createElement('button');
        button.className = 'movie-choice';
        button.type = 'button';
        button.setAttribute('aria-selected', String(optionIndex === movieChoiceSelection));
        const name = document.createElement('span');
        name.textContent = item.label;
        const detail = document.createElement('span');
        detail.className = 'movie-choice-detail';
        detail.textContent = item.detail || (item.ready ? 'Ready to play' : 'Finding video URL…');
        button.append(name, detail);
        button.addEventListener('click', () => {
          selectMovieChoice(optionIndex);
          void playMovieChoice(optionIndex);
        });
        movieChoiceList.append(button);
      });
      if (previousId) {
        const matchingIndex = movieChoiceItems.findIndex((item) => item.id === previousId);
        if (matchingIndex !== -1) movieChoiceSelection = matchingIndex;
      } else {
        movieChoiceSelection = 0;
      }
      selectMovieChoice(movieChoiceSelection, false);
      if (movieChoiceItems[movieChoiceSelection]?.ready && !movieChoiceTimer) startMovieChoiceCountdown();
      if (!movieChoiceItems[movieChoiceSelection]?.ready) {
        movieChoiceStatus.textContent = 'Finding a playable video link…';
      }
    }

    async function resolveMovieOptions() {
      if (!movieSourceUrl || typeof GetAllVideoUrl !== 'function') return [];
      if (movieResolvedFor === movieSourceUrl && movieResolvedOptions.length) return movieResolvedOptions;
      if (movieResolvePromise) return movieResolvePromise;

      const resolvingUrl = movieSourceUrl;
      const resolvingDirectUrl = movieDirectUrl;
      movieChoiceStatus.textContent = 'Finding video URL…';
      movieResolveLoaderTimer = setTimeout(() => {
        if (!movieChoiceOverlay.hidden && movieSourceUrl === resolvingUrl) {
          movieChoiceStatus.innerHTML = '<span class="loading-spinner" aria-hidden="true" style="display:inline-block;width:18px;height:18px;vertical-align:middle;margin-right:8px"></span>Still finding video URLs…';
        }
      }, 5000);
      movieResolvePromise = GetAllVideoUrl(resolvingUrl)
        .then((result) => {
          movieResolvedFor = resolvingUrl;
          movieResolvedOptions = (result?.videos || []).slice().sort((first, second) =>
            (second.resolution || 0) - (first.resolution || 0)
          );
          if (resolvingDirectUrl && !movieResolvedOptions.some((item) => item.url === resolvingDirectUrl)) {
            movieResolvedOptions.unshift({
              url: resolvingDirectUrl,
              label: 'Direct video',
              resolution: 0,
              direct: true
            });
          }
          movieNeedsRetry = !standardMovieOption(movieResolvedOptions);
          if (movieSourceUrl === resolvingUrl && !qualityPicker.hidden) {
            qualityOptions = movieResolvedOptions;
            renderQualityOptions();
          }
          return movieResolvedOptions;
        })
        .catch((error) => {
          movieResolvedFor = resolvingUrl;
          movieResolvedOptions = [];
          movieNeedsRetry = true;
          console.warn('Could not resolve movie video URLs', error);
          return [];
        })
        .finally(() => {
          movieResolvePromise = null;
          clearTimeout(movieResolveLoaderTimer);
          movieResolveLoaderTimer = null;
          renderMovieChoices();
          if (!qualityPicker.hidden && movieSourceUrl === resolvingUrl) {
            qualityOptions = movieResolvedOptions;
            renderQualityOptions();
          }
          if (movieSourceUrl && movieSourceUrl !== resolvingUrl) void resolveMovieOptions();
        });
      return movieResolvePromise;
    }

    async function playMovieChoice(index) {
      const selected = movieChoiceItems[index];
      if (!selected) {
        if (!movieChoiceItems.length) void pollMovieLink();
        return;
      }
      if (selected.id === 'source' && !selected.ready) {
        await resolveMovieOptions();
        const resolved = movieChoiceItems.find((item) => item.id === 'source');
        if (!resolved?.ready) return;
        return playMovieChoice(movieChoiceItems.indexOf(resolved));
      }
      if (!selected.url) return;

      if (selected.id === 'direct') {
        const status = await checkMovieUrlStatus(selected.url);
        if (status === 404) {
          movieFallbackInProgress = true;
          failedMovieUrls.add(selected.url);
          renderMovieChoices();
          await playMovie2AfterMovie1Failure('Movie 1 returned HTTP 404');
          return;
        }
      }

      movieVideoUrl = selected.url;
      movieNeedsRetry = false;
      moviePlaybackActive = true;
      moviePlaybackChoiceId = selected.id;
      movieFallbackInProgress = false;
      updateMovieQualityButton();
      closeMovieChooser();
      const movieIndex = updateMovieChannel(selected.url, selected.direct);
      loadChannel(movieIndex, true);
    }

    async function checkMovieUrlStatus(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch(url, {
          method: 'HEAD',
          cache: 'no-store',
          signal: controller.signal
        });
        return response.status;
      } catch (error) {
        console.info('Could not verify Movie 1 HTTP status; attempting Movie 1 playback.', error);
        return null;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function playMovie2AfterMovie1Failure(reason = 'Movie 1 failed') {
      const sourceChoice = movieChoiceItems.find((item) => item.id === 'source');
      if (!sourceChoice) {
        movieChoiceStatus.textContent = `${reason}. Movie 2 is unavailable.`;
        return;
      }
      if (!sourceChoice.ready) {
        movieChoiceSelection = movieChoiceItems.indexOf(sourceChoice);
        renderMovieChoices();
        movieChoiceStatus.textContent = `${reason}. Finding Movie 2…`;
        await resolveMovieOptions();
      }
      const resolvedChoice = movieChoiceItems.find((item) => item.id === 'source');
      if (!resolvedChoice?.ready) {
        movieChoiceStatus.textContent = `${reason}. Movie 2 has no playable URL.`;
        return;
      }
      await playMovieChoice(movieChoiceItems.indexOf(resolvedChoice));
    }

    function openMovieChooser() {
      moviePlaybackActive = false;
      movieLoading.hidden = true;
      movieChoiceOverlay.hidden = false;
      qualityPicker.hidden = true;
      renderMovieChoices();
      if (!movieDataReady || movieLinkFetchFailed) void pollMovieLink();
      if (movieSourceUrl && !movieResolvedOptions.length) void resolveMovieOptions();
    }

    function updateMovieChannel(url, directMedia = false) {
      const movieChannel = {
        id: MOVIE_CHANNEL_ID,
        name: 'Latest Movie',
        logo: MOVIE_LOGO_URL,
        group: 'Movie link',
        directMedia,
        language: 'Tamil',
        resolution: 'Unknown',
        url
      };
      const existingIndex = channels.findIndex((channel) => channel.id === MOVIE_CHANNEL_ID);
      if (existingIndex === -1) channels.push(movieChannel);
      else channels[existingIndex] = movieChannel;
      storeLocalPlaylist(channels);
      updateCounter();
      return channels.findIndex((channel) => channel.id === MOVIE_CHANNEL_ID);
    }

    async function resolveMovieLink(playWhenReady = false, isRetry = false) {
      if (!movieSourceUrl || movieResolveInProgress || typeof GetQuickVideoUrl !== 'function') return;
      movieResolveInProgress = true;
      try {
        const result = await GetQuickVideoUrl(movieSourceUrl);
        console.log('GetQuickVideoUrl output:', result);
        const resolvedUrl = result?.video?.url;
        if (!resolvedUrl || failedMovieUrls.has(resolvedUrl)) {
          movieNeedsRetry = true;
          if (channels[idx]?.id === MOVIE_CHANNEL_ID) {
            showName.textContent = resolvedUrl
              ? 'Video URL failed; retrying shortly'
              : 'No video URL found; retrying shortly';
          }
          return;
        }

        movieVideoUrl = resolvedUrl;
        moviePlaybackChoiceId = 'source';
        movieNeedsRetry = false;
        updateMovieQualityButton();
        const movieIndex = updateMovieChannel(resolvedUrl);
        if (playWhenReady && channels[idx]?.id === MOVIE_CHANNEL_ID) {
          loadChannel(movieIndex, true, isRetry);
        }
      } catch (error) {
        movieNeedsRetry = true;
        console.warn('Could not resolve the latest movie link', error);
        if (channels[idx]?.id === MOVIE_CHANNEL_ID) {
          showName.textContent = 'Could not find video; retrying shortly';
        }
      } finally {
        movieResolveInProgress = false;
      }
    }

    async function pollMovieLink() {
      if (moviePollInProgress) return;
      moviePollInProgress = true;
      try {
        const response = await fetch(MOVIE_LINK_URL, {
          cache: 'no-store',
          headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const directVideoUrl = extractMovieUrl(data?.record?.video_url);
        const sourceUrl = extractMovieUrl(data?.record?.url);
        const fetchedUrls = `${directVideoUrl}|${sourceUrl}`;
        const linksChanged = fetchedUrls !== lastMovieFetchUrl;
        lastMovieFetchUrl = fetchedUrls;
        movieDataReady = true;
        movieLinkFetchFailed = false;
        if (linksChanged) {
          movieResolvedFor = '';
          movieResolvedOptions = [];
          qualityOptions = [];
          qualitySelection = 0;
          movieChoiceSelection = 0;
          movieChoiceItems = [];
          failedMovieUrls.clear();
          movieFallbackInProgress = false;
        }
        movieDirectUrl = directVideoUrl;
        movieSourceUrl = sourceUrl;
        movieSourceElement.textContent = sourceUrl || directVideoUrl;
        movieNeedsRetry = !directVideoUrl && Boolean(sourceUrl);
        const wasPlayingMovie = channels[idx]?.id === MOVIE_CHANNEL_ID;
        console.log('Latest movie links updated:', directVideoUrl || sourceUrl || 'empty');
        updateMovieChannel(directVideoUrl || sourceUrl || MOVIE_LINK_URL, Boolean(directVideoUrl));
        if (wasPlayingMovie) qualityButton.hidden = !sourceUrl && !directVideoUrl;
        if (wasPlayingMovie && !moviePlaybackActive) {
          renderMovieChoices();
          if (movieSourceUrl && !movieResolvedOptions.length) void resolveMovieOptions();
        } else if (wasPlayingMovie && moviePlaybackActive && linksChanged && movieSourceUrl) {
          if (!qualityPicker.hidden) {
            qualityList.innerHTML = '<div class="quality-empty">Updated movie link. Finding qualities…</div>';
          }
          void resolveMovieOptions();
        } else if (wasPlayingMovie && moviePlaybackActive && linksChanged && movieDirectUrl) {
          qualityOptions = [{
            url: movieDirectUrl,
            label: 'Direct video',
            resolution: 0,
            direct: true
          }];
          if (!qualityPicker.hidden) renderQualityOptions();
        }
      } catch (error) {
        movieDataReady = true;
        movieLinkFetchFailed = true;
        console.warn('Could not poll the latest movie link', error);
        if (channels[idx]?.id === MOVIE_CHANNEL_ID && !moviePlaybackActive) renderMovieChoices();
      } finally {
        moviePollInProgress = false;
      }
    }

    function clearPlaybackTimers() {
      clearTimeout(retryTimer);
      clearTimeout(stallTimer);
      clearTimeout(stablePlaybackTimer);
      retryTimer = null;
      stallTimer = null;
      stablePlaybackTimer = null;
    }

    function handlePlaybackFailure(token, error) {
      if (token !== activePlaybackToken || retryTimer) return;
      console.warn(`Playback attempt ${playbackAttempts}/${MAX_PLAYBACK_ATTEMPTS} failed`, error);
      clearTimeout(stallTimer);
      clearTimeout(stablePlaybackTimer);
      stallTimer = null;
      stablePlaybackTimer = null;

      if (channels[idx]?.id === MOVIE_CHANNEL_ID) {
        if (moviePlaybackChoiceId === 'direct' && !movieFallbackInProgress) {
          movieFallbackInProgress = true;
          failedMovieUrls.add(movieVideoUrl);
          showName.textContent = 'Movie 1 failed; trying Movie 2…';
          retryTimer = setTimeout(() => {
            retryTimer = null;
            openMovieChooser();
            void playMovie2AfterMovie1Failure();
          }, 0);
          return;
        }

        if (playbackAttempts >= MOVIE_MAX_PLAYBACK_ATTEMPTS) {
          movieNeedsRetry = false;
          movieLoading.hidden = true;
          showName.textContent = `Latest movie failed after ${MOVIE_MAX_PLAYBACK_ATTEMPTS} attempts`;
          return;
        }
        if (movieVideoUrl) failedMovieUrls.add(movieVideoUrl);
        movieVideoUrl = '';
        movieNeedsRetry = true;
        showName.textContent = `Movie failed (${playbackAttempts}/${MOVIE_MAX_PLAYBACK_ATTEMPTS}); retrying soon…`;
        const retryDelay = Math.min(playbackAttempts * 7500, MOVIE_MAX_RETRY_DELAY);
        retryTimer = setTimeout(() => {
          retryTimer = null;
          if (movieSourceUrl) void retryMoviePlayback();
          else loadChannel(idx, true, true);
        }, retryDelay);
        return;
      }

      if (playbackAttempts >= MAX_PLAYBACK_ATTEMPTS) {
        showName.textContent = 'Stream failed after 5 attempts; trying next channel';
        retryTimer = setTimeout(() => {
          retryTimer = null;
          loadChannel(idx + 1, true);
        }, 700);
        return;
      }

      showName.textContent = `Retrying stream (${playbackAttempts + 1}/${MAX_PLAYBACK_ATTEMPTS})`;
      retryTimer = setTimeout(() => {
        retryTimer = null;
        loadChannel(idx, true, true);
      }, 1200);
    }

    function loadChannel(index, autoplay = true, isRetry = false) {
      if (!channels.length) return;
      clearPlaybackTimers();
      if (!isRetry) playbackAttempts = 1;
      else playbackAttempts += 1;
      idx = (index + channels.length) % channels.length;
      const ch = channels[idx];
      const isMovie = ch.id === MOVIE_CHANNEL_ID;
      app.classList.toggle('movie-mode', isMovie);
      const token = ++activePlaybackToken;

      logo.src = ch.logo || '';
      logo.classList.toggle('movie-logo', ch.id === MOVIE_CHANNEL_ID);
      channelName.textContent = ch.name || 'Tamil Channel';
      showName.textContent = ch.group || 'Live';
      movieSourceElement.textContent = isMovie ? movieSourceUrl || movieDirectUrl : '';
      moviePlayPauseButton.textContent = video.paused ? 'Play' : 'Pause';
      endTime.textContent = 'LIVE';
      updateCounter();

      if (ch.id !== MOVIE_CHANNEL_ID) {
        moviePlaybackActive = false;
        closeMovieChooser();
      } else if (!moviePlaybackActive) {
        video.pause();
        qualityButton.hidden = !movieSourceUrl && !movieDirectUrl;
        qualityPicker.hidden = true;
        movieLoading.hidden = true;
        openMovieChooser();
        return;
      }

      flash.style.display = 'block';
      setTimeout(() => flash.style.display = 'none', 500);

      video.pause();
      qualityButton.hidden = ch.id !== MOVIE_CHANNEL_ID || (!movieSourceUrl && !movieDirectUrl);
      if (isMovie) updateMovieQualityButton();
      if (ch.id !== MOVIE_CHANNEL_ID) qualityPicker.hidden = true;
      movieLoading.hidden = ch.id !== MOVIE_CHANNEL_ID;
      const isDirectMedia = ch.id === MOVIE_CHANNEL_ID && (ch.directMedia ||
        /\.(mp4|webm|ogg|m4v|mov)(?:$|[?#])/i.test(ch.url));
      void startPlayback(ch.url, token, autoplay, isDirectMedia);
    }

    async function startPlayback(src, token, autoplay, directMedia = false) {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      if (shakaPlayer) {
        const previousPlayer = shakaPlayer;
        shakaPlayer = null;
        await previousPlayer.destroy().catch(() => {});
      }
      if (token !== activePlaybackToken) return;

      video.replaceChildren();
      video.removeAttribute('src');

      if (directMedia) {
        video.controls = false;
        video.src = src;
        video.load();
        if (autoplay) void tryPlay(token);
        return;
      }

      video.controls = false;

      if (window.shaka?.Player?.isBrowserSupported()) {
        try {
          const player = new shaka.Player();
          shakaPlayer = player;
          await player.attach(video);
          if (token !== activePlaybackToken) return;
          player.configure({
            streaming: {
              retryParameters: { maxAttempts: 2, baseDelay: 500, backoffFactor: 1.5 }
            }
          });
          let shakaLoaded = false;
          player.addEventListener('error', (event) => {
            if (shakaLoaded && token === activePlaybackToken) handlePlaybackFailure(token, event.detail);
          });
          await player.load(src);
          shakaLoaded = true;
          if (token === activePlaybackToken && autoplay) await tryPlay(token);
          return;
        } catch (error) {
          if (token !== activePlaybackToken) return;
          console.warn('Shaka playback failed; trying HLS/native fallback', error);
          const failedPlayer = shakaPlayer;
          shakaPlayer = null;
          if (failedPlayer) await failedPlayer.destroy().catch(() => {});
          if (token !== activePlaybackToken) return;
        }
      }

      if (window.Hls && Hls.isSupported() && /\.m3u8?(?:$|\?)/i.test(src)) {
        hls = new Hls({
          maxBufferLength: 20,
          backBufferLength: 12,
          lowLatencyMode: false,
          debug: false,
          manifestLoadingMaxRetry: 2,
          levelLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 2
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (token === activePlaybackToken && data?.fatal) handlePlaybackFailure(token, data);
        });
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (token === activePlaybackToken && autoplay) void tryPlay(token);
        });
        hls.attachMedia(video);
        hls.on(Hls.Events.MEDIA_ATTACHED, () => {
          if (token === activePlaybackToken) hls.loadSource(src);
        });
        return;
      }

      video.src = src;
      if (autoplay) void tryPlay(token);
    }

    async function tryPlay(token = activePlaybackToken) {
      try {
        video.muted = isMuted;
        if (audioGainNode) audioGainNode.gain.value = isMuted ? 0 : video.volume;
        await video.play();
      } catch (err) {
        try {
          video.muted = true;
          if (audioGainNode) audioGainNode.gain.value = 0;
          await video.play();
          isMuted = true;
        } catch (err2) {
          console.warn('Autoplay blocked', err2);
          if (token === activePlaybackToken && err2.name !== 'NotAllowedError') {
            handlePlaybackFailure(token, err2);
          }
        }
      }
    }

    async function setAudioDelay(nextDelay) {
      audioDelaySeconds = Math.max(0, Math.min(2, nextDelay));
      delayValue.textContent = `${Math.round(audioDelaySeconds * 1000)} ms`;
      if (!audioDelaySeconds && !audioDelayNode) return;

      try {
        if (!audioContext) {
          const currentUrl = channels[idx]?.url;
          if (!currentUrl) throw new Error('No active stream');
          await fetch(currentUrl, { method: 'HEAD', mode: 'cors', cache: 'no-store' });
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error('Web Audio is not supported in this browser');
          audioContext = new AudioContextClass();
          audioSource = audioContext.createMediaElementSource(video);
          audioDelayNode = audioContext.createDelay(2);
          audioGainNode = audioContext.createGain();
          audioDelayNode.delayTime.value = audioDelaySeconds;
          audioGainNode.gain.value = isMuted ? 0 : video.volume;
          audioSource.connect(audioDelayNode);
          audioDelayNode.connect(audioGainNode);
          audioGainNode.connect(audioContext.destination);
        } else {
          await audioContext.resume();
          audioDelayNode.delayTime.setTargetAtTime(audioDelaySeconds, audioContext.currentTime, 0.03);
        }
      } catch (error) {
        audioDelaySeconds = 0;
        delayValue.textContent = 'N/A';
        console.warn('Audio delay is unavailable for this cross-origin stream', error);
      }
    }

    function adjustVolume(amount) {
      video.volume = Math.max(0, Math.min(1, video.volume + amount));
      if (video.volume > 0 && isMuted) {
        isMuted = false;
        video.muted = false;
      }
      if (audioGainNode) audioGainNode.gain.value = isMuted ? 0 : video.volume;
      volumeValue.textContent = `${Math.round(video.volume * 100)}%`;
    }

    function seekVideo(seconds) {
      if (!Number.isFinite(video.duration) || video.duration <= 0) return;
      const targetTime = video.currentTime + seconds;
      video.currentTime = Math.max(0, Math.min(video.duration, targetTime));
    }

    function formatMediaTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const totalSeconds = Math.floor(seconds);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const remainingSeconds = totalSeconds % 60;
      return hours
        ? `${hours}:${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`
        : `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    function updateSeekBar() {
      const duration = video.duration;
      const seekable = Number.isFinite(duration) && duration > 0;
      seekBar.hidden = !seekable;
      seekInput.disabled = !seekable;
      if (!seekable) return;

      const progress = Math.max(0, Math.min(1, video.currentTime / duration));
      seekInput.value = String(Math.round(progress * Number(seekInput.max)));
      seekInput.style.setProperty('--seek-progress', `${progress * 100}%`);
      currentTimeLabel.textContent = formatMediaTime(video.currentTime);
      durationTimeLabel.textContent = formatMediaTime(duration);
    }

    async function toggleFullscreenAndUnmute() {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
        return;
      }

      isMuted = false;
      video.muted = false;
      if (audioGainNode) audioGainNode.gain.value = video.volume;

      try {
        await app.requestFullscreen();
      } catch (error) {
        console.warn('Could not enter fullscreen mode', error);
      }
    }

    let autoClickTimeout = null;

    function triggerAutoClick() {
      if (autoClickTimeout) clearTimeout(autoClickTimeout);
      autoClickTimeout = setTimeout(() => {
        if (isMuted) video.click();
      }, 1500);
    }

    function showUi() {
      app.classList.remove('ui-hidden');
      clearTimeout(window.__tvUiHideTimer);
      window.__tvUiHideTimer = setTimeout(() => {
        app.classList.add('ui-hidden');
      }, app.classList.contains('movie-mode') ? 6000 : 2600);
    }

    ['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach((eventName) => {
      document.addEventListener(eventName, showUi);
    });

    prevChannelBtn.addEventListener('click', () => loadChannel(idx - 1, true));
    nextChannelBtn.addEventListener('click', () => loadChannel(idx + 1, true));
    prevBottomBtn.addEventListener('click', () => loadChannel(idx - 1, true));
    nextBottomBtn.addEventListener('click', () => loadChannel(idx + 1, true));
    delayDownBtn.addEventListener('click', () => void setAudioDelay(audioDelaySeconds - 0.1));
    delayUpBtn.addEventListener('click', () => void setAudioDelay(audioDelaySeconds + 0.1));
    volumeDownBtn.addEventListener('click', () => adjustVolume(-0.05));
    volumeUpBtn.addEventListener('click', () => adjustVolume(0.05));
    seekInput.addEventListener('input', () => {
      if (!Number.isFinite(video.duration) || video.duration <= 0) return;
      video.currentTime = (Number(seekInput.value) / Number(seekInput.max)) * video.duration;
      updateSeekBar();
    });

    movieRetryButton.addEventListener('click', () => void pollMovieLink());
    movieQualityButton.addEventListener('click', () => void openQualityPicker());
    movieRefreshButton.addEventListener('click', () => void pollMovieLink());
    movieFullscreenButton.addEventListener('click', () => void toggleFullscreenAndUnmute());
    movieBack10Button.addEventListener('click', () => seekVideo(-10));
    movieForward10Button.addEventListener('click', () => seekVideo(10));
    moviePlayPauseButton.addEventListener('click', () => {
      if (video.paused) void tryPlay(activePlaybackToken);
      else video.pause();
    });
    ['pointermove', 'pointerdown'].forEach((eventName) => {
      qualityPicker.addEventListener(eventName, () => {
        if (!qualityPicker.hidden) scheduleQualityPickerHide();
      });
    });

    ['durationchange', 'loadedmetadata', 'timeupdate', 'seeked'].forEach((eventName) => {
      video.addEventListener(eventName, updateSeekBar);
    });

    function closeQualityPicker() {
      clearTimeout(qualityPickerHideTimer);
      qualityPickerHideTimer = null;
      qualityPicker.hidden = true;
    }

    function scheduleQualityPickerHide() {
      clearTimeout(qualityPickerHideTimer);
      qualityPickerHideTimer = setTimeout(closeQualityPicker, 6000);
    }

    function selectQuality(index) {
      if (!qualityOptions.length) return;
      qualitySelection = (index + qualityOptions.length) % qualityOptions.length;
      qualityList.querySelectorAll('.quality-option').forEach((option, optionIndex) => {
        option.setAttribute('aria-selected', String(optionIndex === qualitySelection));
      });
      qualityList.querySelectorAll('.quality-option')[qualitySelection]?.scrollIntoView({ block: 'nearest' });
      scheduleQualityPickerHide();
    }

    function renderQualityOptions() {
      qualityList.replaceChildren();
      if (!qualityOptions.length) {
        qualityList.innerHTML = '<div class="quality-empty">No video URLs found.</div>';
        return;
      }

      qualityOptions.forEach((videoOption, optionIndex) => {
        const button = document.createElement('button');
        button.className = 'quality-option';
        button.type = 'button';
        button.setAttribute('aria-selected', 'false');
        const label = document.createElement('span');
        label.textContent = videoOption.label || 'Video';
        const resolution = document.createElement('span');
        resolution.textContent = videoOption.resolution ? `${videoOption.resolution}p` : 'Unknown';
        button.append(label, resolution);
        button.addEventListener('click', () => {
          qualitySelection = optionIndex;
          playSelectedQuality();
        });
        qualityList.append(button);
      });

      const currentIndex = qualityOptions.findIndex((option) => option.url === movieVideoUrl);
      const standard = standardMovieOption(qualityOptions);
      const selectedIndex = currentIndex !== -1 ? currentIndex : qualityOptions.indexOf(standard);
      selectQuality(selectedIndex === -1 ? 0 : selectedIndex);
    }

    function playSelectedQuality() {
      const selected = qualityOptions[qualitySelection];
      if (!selected?.url) return;
      if (selected.url === movieVideoUrl) return;
      movieVideoUrl = selected.url;
      movieNeedsRetry = false;
      moviePlaybackActive = true;
      moviePlaybackChoiceId = 'source';
      updateMovieQualityButton();
      const movieIndex = updateMovieChannel(selected.url);
      loadChannel(movieIndex, true);
    }

    async function openQualityPicker() {
      if (!qualityOptions.length && !movieSourceUrl) return;
      qualityPicker.hidden = false;
      scheduleQualityPickerHide();
      if (!movieSourceUrl && qualityOptions.length) {
        renderQualityOptions();
        return;
      }
      if (movieResolvedFor === movieSourceUrl && movieResolvedOptions.length) {
        qualityOptions = movieResolvedOptions;
        renderQualityOptions();
        return;
      }
      qualityList.innerHTML = '<div class="quality-empty">Finding available qualities…</div>';
      void resolveMovieOptions();
    }

    async function retryMoviePlayback() {
      if (!movieSourceUrl || movieResolveInProgress) return;
      movieResolveInProgress = true;
      try {
        if (typeof GetAllVideoUrl === 'function') {
          const result = await GetAllVideoUrl(movieSourceUrl);
          console.log('GetAllVideoUrl retry output:', result);
          const alternative = (result?.videos || []).find((candidate) =>
            candidate.url && !failedMovieUrls.has(candidate.url)
          );
          if (alternative) {
            movieVideoUrl = alternative.url;
            moviePlaybackChoiceId = 'source';
            movieNeedsRetry = false;
            const movieIndex = updateMovieChannel(alternative.url);
            if (channels[idx]?.id === MOVIE_CHANNEL_ID) loadChannel(movieIndex, true, true);
            return;
          }
        }
      } catch (error) {
        console.warn('Could not find an alternative movie URL', error);
      } finally {
        movieResolveInProgress = false;
      }
      await resolveMovieLink(channels[idx]?.id === MOVIE_CHANNEL_ID, true);
      if (movieNeedsRetry && channels[idx]?.id === MOVIE_CHANNEL_ID && !retryTimer) {
        playbackAttempts += 1;
        handlePlaybackFailure(activePlaybackToken, new Error('Could not resolve a movie URL'));
      }
    }

    qualityButton.addEventListener('click', () => void openQualityPicker());
    qualityClose.addEventListener('click', closeQualityPicker);

    window.addEventListener('keydown', (ev) => {
      if (!qualityPicker.hidden) {
        if (ev.key === 'w' || ev.key === 'W' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          selectQuality(qualitySelection - 1);
        } else if (ev.key === 's' || ev.key === 'S' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          selectQuality(qualitySelection + 1);
        } else if (ev.key === 'Enter') {
          ev.preventDefault();
          playSelectedQuality();
        } else if (ev.key === 'Escape') {
          closeQualityPicker();
        }
        return;
      }

      if (!movieChoiceOverlay.hidden) {
        if (ev.key === 'w' || ev.key === 'W' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          selectMovieChoice(movieChoiceSelection - 1);
        } else if (ev.key === 's' || ev.key === 'S' || ev.key === 'ArrowDown') {
          ev.preventDefault();
          selectMovieChoice(movieChoiceSelection + 1);
        } else if (ev.key === 'Enter') {
          ev.preventDefault();
          if (movieChoiceItems.length) void playMovieChoice(movieChoiceSelection);
          else void pollMovieLink();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          closeMovieChooser();
        }
        return;
      }

      if ((ev.key === 'w' || ev.key === 'W' || ev.key === 's' || ev.key === 'S') &&
          channels[idx]?.id === MOVIE_CHANNEL_ID && moviePlaybackActive && movieSourceUrl) {
        ev.preventDefault();
        void openQualityPicker();
      } else if ((ev.key === ' ' || ev.key === 'Spacebar') && channels[idx]?.id === MOVIE_CHANNEL_ID) {
        ev.preventDefault();
        if (video.paused) void tryPlay(activePlaybackToken);
        else video.pause();
      } else if ((ev.key === 'f' || ev.key === 'F') && !ev.repeat) {
        ev.preventDefault();
        void toggleFullscreenAndUnmute();
      } else if (ev.key === 'ArrowLeft') {
        // if (channels[idx]?.id === MOVIE_CHANNEL_ID) seekVideo(-10);
        // else 
        {
          loadChannel(idx - 1, true);
          triggerAutoClick();
        }
      } else if (ev.key === 'ArrowRight') {
        // if (channels[idx]?.id === MOVIE_CHANNEL_ID) seekVideo(10);
        // else 
        {
          loadChannel(idx + 1, true);
          triggerAutoClick();
        }
      } else if (ev.key === 'ArrowUp') {
        ev.preventDefault();
        adjustVolume(0.05);
      } else if (ev.key === 'ArrowDown') {
        ev.preventDefault();
        adjustVolume(-0.05);
      } else if (ev.key === ',') {
        ev.preventDefault();
        seekVideo(-5);
      } else if (ev.key === '.') {
        ev.preventDefault();
        seekVideo(5);
      } else if (ev.key === '[') {
        ev.preventDefault();
        void setAudioDelay(audioDelaySeconds - 0.1);
      } else if (ev.key === ']') {
        ev.preventDefault();
        void setAudioDelay(audioDelaySeconds + 0.1);
      } else if (ev.key === 'm' || ev.key === 'M') {
        isMuted = !isMuted;
        video.muted = isMuted;
        if (audioGainNode) audioGainNode.gain.value = isMuted ? 0 : video.volume;
      }
    });

    video.addEventListener('click', async () => {
      showUi();
      if (video.paused) {
        await tryPlay();
      } else if (channels[idx]?.id !== MOVIE_CHANNEL_ID) {
        isMuted = !isMuted;
        video.muted = isMuted;
      }
    });

    video.addEventListener('error', (e) => {
      console.error('Video element error', e);
      handlePlaybackFailure(activePlaybackToken, video.error || e);
    });

    video.addEventListener('waiting', () => {
      if (video.paused || stallTimer) return;
      const token = activePlaybackToken;
      stallTimer = setTimeout(() => {
        stallTimer = null;
        if (token === activePlaybackToken && video.readyState < HTMLMediaElement.HAVE_FUTURE_DATA) {
          handlePlaybackFailure(token, new Error('Playback stalled'));
        }
      }, 12000);
    });

    video.addEventListener('playing', () => {
      movieLoading.hidden = true;
      moviePlayPauseButton.textContent = 'Pause';
      updateSeekBar();
      clearTimeout(stallTimer);
      stallTimer = null;
      clearTimeout(stablePlaybackTimer);
      stablePlaybackTimer = setTimeout(() => {
        if (!video.paused) playbackAttempts = 1;
      }, 20000);
    });

    video.addEventListener('pause', () => {
      moviePlayPauseButton.textContent = 'Play';
    });

    showUi();
    video.volume = 0.3;
    volumeValue.textContent = `${Math.round(video.volume * 100)}%`;
    loadPlaylist().finally(() => {
      void pollMovieLink();
      setInterval(() => void pollMovieLink(), MOVIE_POLL_INTERVAL);
      setInterval(() => {
        if (movieNeedsRetry && movieSourceUrl && !movieResolvePromise) {
          movieResolvedFor = '';
          void resolveMovieOptions();
        }
      }, MOVIE_RESOLVE_RETRY_INTERVAL);
    });
  </script>
</body>
</html>
